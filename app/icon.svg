<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  <!-- Rear wheel -->
  <circle cx="9" cy="22" r="6" stroke="#f97316" stroke-width="2"/>
  <circle cx="9" cy="22" r="1.5" fill="#f97316"/>
  <!-- Front wheel -->
  <circle cx="23" cy="22" r="6" stroke="#f97316" stroke-width="2"/>
  <circle cx="23" cy="22" r="1.5" fill="#f97316"/>
  <!-- Frame: seat stay and chain stay -->
  <line x1="9" y1="22" x2="16" y2="13" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <line x1="9" y1="22" x2="16" y2="22" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <!-- Down tube and seat tube -->
  <line x1="16" y1="13" x2="16" y2="22" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <!-- Top tube to front fork -->
  <line x1="16" y1="13" x2="23" y2="22" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <!-- Handlebar -->
  <line x1="21" y1="13" x2="24" y2="13" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <line x1="22.5" y1="13" x2="23" y2="16" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <!-- Saddle -->
  <line x1="14" y1="12" x2="18" y2="12" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
</svg>
